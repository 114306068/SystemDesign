# 沒有裝 MySQL 的組員可以用 Docker 一鍵起資料庫：docker compose up -d
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: gig_radar
      MYSQL_USER: gigradar
      MYSQL_PASSWORD: gigradar
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql

volumes:
  mysql-data:
