# "seed" task: drop and recreate every table from the model classes, then insert demo data.
spring.jpa.hibernate.ddl-auto=create
spring.main.banner-mode=off
logging.level.root=WARN
# On an empty database Hibernate first tries to drop foreign keys of tables that don't exist yet; that is harmless.
logging.level.org.hibernate.tool.schema.internal.ExceptionHandlerLoggedImpl=ERROR
