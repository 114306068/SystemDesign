# Gig Radar main settings. Database credentials come from the .env file in the project root
# (copy .env.example to .env). Values after ':' in ${...} are the defaults when .env is missing.
spring.application.name=gig-radar
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:3306/gig_radar?allowPublicKeyRetrieval=true&useSSL=false}
spring.datasource.username=${DB_USER:gigradar}
spring.datasource.password=${DB_PASSWORD:gigradar}

# The web server never changes tables; run the "seed" task to (re)create them.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=${SQL_ECHO:false}
spring.jpa.properties.hibernate.default_batch_fetch_size=50
spring.jpa.properties.hibernate.auto_quote_keyword=true
# Create columns in the order they are declared (id first), easier to read in db/schema.sql
spring.jpa.properties.hibernate.column_ordering_strategy=legacy

# JSON uses snake_case field names (event_date, ticket_url ...), same as the frontend expects
spring.jackson.property-naming-strategy=SNAKE_CASE

# API docs page: http://127.0.0.1:8000/docs
server.port=8000
springdoc.swagger-ui.path=/docs
